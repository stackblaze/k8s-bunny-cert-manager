# -- Bunny.net API configuration
bunny:
  # -- Bunny.net API key (required)
  apiKey: ""

# -- Domain to manage (required, e.g. stackblaze.app)
domain: ""

# -- ACME / Let's Encrypt configuration
acme:
  # -- Email for Let's Encrypt registration (required)
  email: ""
  # -- ACME server URL
  server: https://acme-v02.api.letsencrypt.org/directory

# -- Certificate configuration
certificates:
  # -- Request a certificate for the root domain
  enabled: true
  # -- Additional DNS names to include in the certificate (SANs)
  # These are appended AFTER any auto-generated wildcard SANs.
  # Example: ["*.example.com", "sub.example.com"]
  additionalDnsNames: []
  # -- Renew certificates this long before expiry
  renewBefore: 720h # 30 days

# -- Option A: Wildcard certificate covering all subdomain x child-subdomain combos.
# Generates SANs like *.api.us-east.example.com, *.app.us-east.example.com, etc.
# Pattern: *.<childSubdomain>.<subdomain>.<domain>
# Set enabled: true and list your subdomains + childSubdomains below.
wildcardCert:
  enabled: false
  # -- Parent subdomains to generate wildcard SANs for (e.g. region, zone, environment)
  subdomains: []
    # - us-east
    # - eu-west
  # -- Child subdomains to nest under each parent subdomain (e.g. service names, types)
  childSubdomains: []
    # - api
    # - app

# -- Option B: Per-ingress dynamic certificates.
# The ClusterIssuer created by this chart can be referenced by ingress annotations:
#   cert-manager.io/cluster-issuer: <issuerName>
# No extra chart config needed — just annotate your Ingress resources.
# The issuer name is: <release>-k8s-bunny-cert-manager-letsencrypt

# -- Webhook solver configuration
webhook:
  # -- Container image for the DNS01 webhook solver
  image:
    repository: ghcr.io/stackblaze/k8s-bunny-cert-manager
    tag: latest
    pullPolicy: Always
  # -- API group name for the webhook
  groupName: acme.bunny.net
  # -- Number of webhook replicas
  replicas: 1
  # -- Resource requests/limits
  resources: {}
  # -- Node selector
  nodeSelector: {}
  # -- Tolerations
  tolerations: []

# -- cert-manager configuration
certManager:
  # -- Namespace where cert-manager is installed (or will be installed)
  namespace: cert-manager
  # -- cert-manager service account name
  serviceAccountName: cert-manager
  # -- cert-manager version to install if not present
  version: v1.17.2
