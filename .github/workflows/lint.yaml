name: Lint and Test Chart

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Helm
      uses: azure/setup-helm@v4

    - name: Lint chart
      run: |
        helm lint . \
          --set bunny.apiKey=test-key \
          --set domain=example.com \
          --set acme.email=test@example.com

    - name: Template chart
      run: |
        helm template test . \
          --set bunny.apiKey=test-key \
          --set domain=example.com \
          --set acme.email=test@example.com \
          --set cluster.name=us-west-1 \
          --set 'cluster.ips={1.2.3.4,5.6.7.8}' \
          --set 'services={web,worker}'

  build-webhook:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build webhook image
      uses: docker/build-push-action@v5
      with:
        context: webhook/
        push: false
        tags: cert-manager-bunny-webhook:test
