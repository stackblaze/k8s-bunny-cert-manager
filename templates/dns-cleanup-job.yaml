{{- if and .Values.dns.cleanup .Values.cluster.ips }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "cert-manager-bunny.fullname" . }}-dns-cleanup
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: {{ include "cert-manager-bunny.name" . }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: dns-cleanup
        image: curlimages/curl:latest
        command: ["sh", "/scripts/dns-manage.sh"]
        args:
        - "delete"
        - "$(BUNNY_API_KEY)"
        - {{ .Values.domain | quote }}
        - {{ .Values.dns.ttl | quote }}
        - {{ join "," .Values.cluster.ips | quote }}
        - {{ .Values.cluster.name | quote }}
        - {{ join "," .Values.services | quote }}
        env:
        - name: BUNNY_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "cert-manager-bunny.secretName" . }}
              key: accessKey
        volumeMounts:
        - name: scripts
          mountPath: /scripts
      volumes:
      - name: scripts
        configMap:
          name: {{ include "cert-manager-bunny.fullname" . }}-dns-script
{{- end }}
