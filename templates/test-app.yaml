{{- if .Values.test.enabled }}
{{- $testSvc := .Values.test.service | default "web" }}
{{- $testHost := printf "test.%s.%s.%s" $testSvc .Values.cluster.name .Values.domain }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cert-manager-bunny.fullname" . }}-test
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "cert-manager-bunny.name" . }}-test
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: {{ include "cert-manager-bunny.name" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "cert-manager-bunny.name" . }}-test
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "cert-manager-bunny.name" . }}-test
    spec:
      containers:
      - name: whoami
        image: traefik/whoami:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cert-manager-bunny.fullname" . }}-test
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: {{ include "cert-manager-bunny.name" . }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "cert-manager-bunny.name" . }}-test
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "cert-manager-bunny.fullname" . }}-test
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: {{ include "cert-manager-bunny.name" . }}
spec:
  {{- if .Values.test.ingressClassName }}
  ingressClassName: {{ .Values.test.ingressClassName }}
  {{- end }}
  tls:
  - hosts:
    - {{ $testHost }}
    secretName: {{ include "cert-manager-bunny.wildcardCertName" . }}
  rules:
  - host: {{ $testHost }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "cert-manager-bunny.fullname" . }}-test
            port:
              number: 80
{{- end }}
