{{- if .Values.certificates.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "cert-manager-bunny.certName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: {{ include "cert-manager-bunny.name" . }}
spec:
  secretName: {{ include "cert-manager-bunny.certName" . }}
  issuerRef:
    name: {{ include "cert-manager-bunny.issuerName" . }}
    kind: ClusterIssuer
  renewBefore: {{ .Values.certificates.renewBefore }}
  dnsNames:
  - {{ .Values.domain | quote }}
{{- include "cert-manager-bunny.wildcardDnsNames" . | indent 2 }}
  {{- range .Values.certificates.additionalDnsNames }}
  - {{ . | quote }}
  {{- end }}
{{- end }}
